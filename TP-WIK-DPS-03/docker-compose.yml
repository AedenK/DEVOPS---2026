version: '3.8'

services:
  my_app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    deploy:
      replicas: 4
    restart: always
    environment:
      - PING_LISTEN_PORT=3000
    networks:
      - front-network

  proxy:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - my_app
    networks:
      - front-network

networks:
  front-network:
    driver: bridge